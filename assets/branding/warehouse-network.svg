<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Three-warehouse network</title>
  <desc id="description">Central connects to Retail and Building Materials. Retail also connects to Building Materials. A package symbol highlights Central to Retail.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080f23"/><stop offset="1" stop-color="#181c42"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#192943"/><stop offset="1" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="wire" x2="1" y2="0">
      <stop stop-color="#256781"/><stop offset="1" stop-color="#58eedb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3868d3" stop-opacity=".32"/><stop offset="1" stop-color="#3868d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a0c3fb" opacity=".16"/>
    </pattern>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="430" rx="24" fill="url(#bg)" stroke="none" /><ellipse cx="768.0" cy="206.4" rx="432.0" ry="206.4" fill="url(#glow)"/><rect x="8" y="8" width="1184" height="414" rx="19" fill="url(#grid)" stroke="none" /><rect x="0.5" y="0.5" width="1199" height="429" rx="24" fill="none" stroke="#2b4064" /><text x="42" y="58" font-size="39" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Warehouse network</text><text x="43" y="91" font-size="20" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Three branches with directional warehouse routes.</text><rect x="948" y="36" width="210" height="38" rx="19" fill="#142b42" stroke="#2b5370" /><text x="1053" y="61" font-size="15" fill="#58eedb" font-weight="650" text-anchor="middle" letter-spacing="1.4">DEMO TOPOLOGY</text><path d="M324 222H562Q580 222 593 209L634 168Q647 155 665 155H876" fill="none" stroke="#54e6d8" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".09"/><path d="M324 222H562Q580 222 593 209L634 168Q647 155 665 155H876" fill="none" stroke="url(#wire)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M324 265H557Q575 265 588 278L629 319Q642 332 660 332H876" fill="none" stroke="#577cdb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1042 205V279" fill="none" stroke="#577cdb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M862 149 870 155 862 161" fill="none" stroke="#58eedb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M862 326 870 332 862 338 M1036 266 1042 274 1048 266" fill="none" stroke="#83a5ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M348 237H510 M682 170H823" fill="none" stroke="#2f4a69" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 8"/><text x="365" y="196" font-size="15" fill="#58eedb" font-weight="650" text-anchor="start" letter-spacing="1.5">SOURCE</text><text x="677" y="139" font-size="14" fill="#58eedb" font-weight="650" text-anchor="start" letter-spacing="1">DEMO ROUTE  /  SA TO RE</text><rect x="42" y="197" width="282" height="100" rx="17" fill="#060d21" stroke="none" /><rect x="42" y="193" width="282" height="100" rx="17" fill="url(#panel)" stroke="#355279" /><rect x="56" y="215" width="55" height="55" rx="12" fill="#10233e" stroke="#37557c" /><g transform="translate(61 220) scale(0.93)"><path d="M4 16 24 5 44 16V40H4Z M12 40V22H36V40 M12 29H36 M12 35H36" fill="none" stroke="#58eedb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><path d="M20 13H28" fill="none" stroke="#58eedb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="125" y="235" font-size="24" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Central</text><text x="126" y="265" font-size="14" fill="#58eedb" font-weight="650" text-anchor="start" letter-spacing="0.8">SA   /   WAREHOUSE</text><rect x="876" y="109" width="282" height="100" rx="17" fill="#060d21" stroke="none" /><rect x="876" y="105" width="282" height="100" rx="17" fill="url(#panel)" stroke="#355279" /><rect x="890" y="127" width="55" height="55" rx="12" fill="#10233e" stroke="#37557c" /><g transform="translate(895 132) scale(0.93)"><path d="M4 16 24 5 44 16V40H4Z M12 40V22H36V40 M12 29H36 M12 35H36" fill="none" stroke="#72efb6" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><path d="M20 13H28" fill="none" stroke="#72efb6" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="959" y="147" font-size="24" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Retail</text><text x="960" y="177" font-size="14" fill="#72efb6" font-weight="650" text-anchor="start" letter-spacing="0.8">RE   /   WAREHOUSE</text><rect x="876" y="286" width="282" height="100" rx="17" fill="#060d21" stroke="none" /><rect x="876" y="282" width="282" height="100" rx="17" fill="url(#panel)" stroke="#355279" /><rect x="890" y="304" width="55" height="55" rx="12" fill="#10233e" stroke="#37557c" /><g transform="translate(895 309) scale(0.93)"><path d="M4 16 24 5 44 16V40H4Z M12 40V22H36V40 M12 29H36 M12 35H36" fill="none" stroke="#83a5ff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><path d="M20 13H28" fill="none" stroke="#83a5ff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="959" y="324" font-size="21" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Building Materials</text><text x="960" y="354" font-size="14" fill="#83a5ff" font-weight="650" text-anchor="start" letter-spacing="0.8">BA   /   WAREHOUSE</text><circle cx="324" cy="222" r="4" fill="#58eedb" /><circle cx="324" cy="265" r="4" fill="#83a5ff" /><g opacity="1.000"><circle cx="726" cy="155" r="28" fill="#58eedb" opacity=".10"/><rect x="710" y="139" width="32" height="32" rx="8" fill="#123550" stroke="#58eedb" /><g transform="translate(713 142) scale(0.54)"><path d="M8 16 24 8 40 16V32L24 40 8 32Z M8 16 24 24 40 16 M24 24V40 M16 12 32 20" fill="none" stroke="#dbfffa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /></g></g><text x="43" y="385" font-size="19" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Illustrated stock movement on one of the demo routes.</text></g>
</svg>
