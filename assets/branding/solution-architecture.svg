<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-labelledby="title description">
  <title id="title">High-level Odoo solution architecture</title>
  <desc id="description">Branch policies constrain the transfer workflow, which coordinates two stock operations through shared transit. Scoped records are surfaced in transfer and stock views.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080f23"/><stop offset="1" stop-color="#181c42"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#192943"/><stop offset="1" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="wire" x2="1" y2="0">
      <stop stop-color="#256781"/><stop offset="1" stop-color="#58eedb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3868d3" stop-opacity=".32"/><stop offset="1" stop-color="#3868d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a0c3fb" opacity=".16"/>
    </pattern>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="398" rx="24" fill="url(#bg)" stroke="none" /><ellipse cx="768.0" cy="191.04" rx="432.0" ry="191.04" fill="url(#glow)"/><rect x="8" y="8" width="1184" height="382" rx="19" fill="url(#grid)" stroke="none" /><rect x="0.5" y="0.5" width="1199" height="397" rx="24" fill="none" stroke="#2b4064" /><text x="42" y="58" font-size="39" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Solution architecture</text><text x="43" y="91" font-size="20" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Branch policy, transfer orchestration and inventory records.</text><rect x="948" y="36" width="210" height="38" rx="19" fill="#142b42" stroke="#2b5370" /><text x="1053" y="61" font-size="15" fill="#58eedb" font-weight="650" text-anchor="middle" letter-spacing="1.4">ODOO 19 COMMUNITY</text><rect x="42" y="136" width="360" height="138" rx="17" fill="url(#panel)" stroke="#375176" /><g transform="translate(63 154) scale(0.76)"><path d="M24 14V23 M24 23H10V32 M24 23H38V32" fill="none" stroke="#58eedb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><rect x="18" y="4" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /><rect x="4" y="32" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /><rect x="32" y="32" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /></g><text x="111" y="181" font-size="27" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Branch scope</text><text x="66" y="221" font-size="19" fill="#58eedb" font-weight="600" text-anchor="start" letter-spacing="0">Branch companies</text><text x="66" y="250" font-size="19" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Warehouse responsibilities</text><rect x="420" y="136" width="360" height="138" rx="17" fill="url(#panel)" stroke="#375176" /><g transform="translate(441 154) scale(0.76)"><path d="M4 14H40L33 7 M44 34H8L15 41 M40 14 33 21 M8 34 15 27" fill="none" stroke="#83a5ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" /></g><text x="489" y="181" font-size="27" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Transfer workflow</text><text x="444" y="221" font-size="19" fill="#83a5ff" font-weight="600" text-anchor="start" letter-spacing="0">Request and approval</text><text x="444" y="250" font-size="19" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Two linked picking legs</text><rect x="798" y="136" width="360" height="138" rx="17" fill="url(#panel)" stroke="#375176" /><g transform="translate(819 154) scale(0.76)"><path d="M4 16 24 5 44 16V40H4Z M12 40V22H36V40 M12 29H36 M12 35H36" fill="none" stroke="#72efb6" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><path d="M20 13H28" fill="none" stroke="#72efb6" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="867" y="181" font-size="27" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Stock operations</text><text x="822" y="221" font-size="19" fill="#72efb6" font-weight="600" text-anchor="start" letter-spacing="0">Source → shared transit</text><text x="822" y="250" font-size="19" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Shared transit → destination</text><path d="M405 204h12 M412 200l4 4-4 4 M783 204h12 M790 200l4 4-4 4" fill="none" stroke="#58eedb" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M222 275v22h756v-22 M600 275v22" fill="none" stroke="#49688f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="42" y="308" width="1116" height="52" rx="14" fill="#13253d" stroke="#375176" /><text x="600" y="341" font-size="21" fill="#f3f8ff" font-weight="650" text-anchor="middle" letter-spacing="0">Transfer dashboard and warehouse stock views use scoped Odoo records</text></g>
</svg>
