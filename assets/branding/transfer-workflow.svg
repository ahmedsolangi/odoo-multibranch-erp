<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-labelledby="title description">
  <title id="title">Inter-branch transfer lifecycle</title>
  <desc id="description">Request, source approval and successful reservation precede physical dispatch. Dispatch moves stock into transit. Destination receipt completes the transfer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080f23"/><stop offset="1" stop-color="#181c42"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#192943"/><stop offset="1" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="wire" x2="1" y2="0">
      <stop stop-color="#256781"/><stop offset="1" stop-color="#58eedb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3868d3" stop-opacity=".32"/><stop offset="1" stop-color="#3868d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a0c3fb" opacity=".16"/>
    </pattern>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="386" rx="24" fill="url(#bg)" stroke="none" /><ellipse cx="768.0" cy="185.28" rx="432.0" ry="185.28" fill="url(#glow)"/><rect x="8" y="8" width="1184" height="370" rx="19" fill="url(#grid)" stroke="none" /><rect x="0.5" y="0.5" width="1199" height="385" rx="24" fill="none" stroke="#2b4064" /><text x="42" y="58" font-size="39" fill="#f3f8ff" font-weight="700" text-anchor="start" letter-spacing="0">Inter-branch transfer lifecycle</text><text x="43" y="91" font-size="20" fill="#a9bddb" font-weight="500" text-anchor="start" letter-spacing="0">Approval secures stock. Dispatch starts transit. Receipt completes the route.</text><rect x="948" y="36" width="210" height="38" rx="19" fill="#142b42" stroke="#2b5370" /><text x="1053" y="61" font-size="15" fill="#58eedb" font-weight="650" text-anchor="middle" letter-spacing="1.4">CONCEPTUAL FLOW</text><path d="M208 206H227 M222 201 227 206 222 211" fill="none" stroke="#718eb6" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" /><rect x="39" y="130" width="174" height="153" rx="19" fill="#83a5ff" stroke="none" opacity="0.000"/><rect x="42" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="42" y="133" width="168" height="147" rx="17" fill="none" stroke="#83a5ff" opacity="0.000" stroke-width="2"/><rect x="106" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(108 153) scale(0.75)"><path d="M12 5H29L37 13V43H12Z M29 5V14H37 M18 21H31 M18 28H31 M18 35H26" fill="none" stroke="#83a5ff" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="126" y="235" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">Request</text><rect x="101" y="266" width="50" height="3" rx="1.5" fill="#83a5ff" stroke="none" opacity="0.460"/><path d="M398 206H417 M412 201 417 206 412 211" fill="none" stroke="#718eb6" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" /><rect x="229" y="130" width="174" height="153" rx="19" fill="#ffd18a" stroke="none" opacity="0.000"/><rect x="232" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="232" y="133" width="168" height="147" rx="17" fill="none" stroke="#ffd18a" opacity="0.000" stroke-width="2"/><rect x="296" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(298 153) scale(0.75)"><path d="M24 5 39 11V23Q39 36 24 43 9 36 9 23V11Z M16 23 22 29 32 18" fill="none" stroke="#ffd18a" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="316" y="235" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">Approval</text><rect x="291" y="266" width="50" height="3" rx="1.5" fill="#ffd18a" stroke="none" opacity="0.460"/><path d="M588 206H607 M602 201 607 206 602 211" fill="none" stroke="#718eb6" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" /><rect x="419" y="130" width="174" height="153" rx="19" fill="#83a5ff" stroke="none" opacity="0.000"/><rect x="422" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="422" y="133" width="168" height="147" rx="17" fill="none" stroke="#83a5ff" opacity="0.000" stroke-width="2"/><rect x="486" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(488 153) scale(0.75)"><path d="M8 16 24 8 40 16V32L24 40 8 32Z M8 16 24 24 40 16 M24 24V40" fill="none" stroke="#83a5ff" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="506" y="235" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">Reservation</text><rect x="481" y="266" width="50" height="3" rx="1.5" fill="#83a5ff" stroke="none" opacity="0.460"/><path d="M778 206H797 M792 201 797 206 792 211" fill="none" stroke="#718eb6" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" /><rect x="609" y="130" width="174" height="153" rx="19" fill="#58eedb" stroke="none" opacity="0.000"/><rect x="612" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="612" y="133" width="168" height="147" rx="17" fill="none" stroke="#58eedb" opacity="0.000" stroke-width="2"/><rect x="676" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(678 153) scale(0.75)"><path d="M5 14H27V32H5Z M27 21H35L43 29V32H27 M9 37H12 M34 37H37" fill="none" stroke="#58eedb" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="696" y="225" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">Physical</text><text x="696" y="251" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">dispatch</text><rect x="671" y="266" width="50" height="3" rx="1.5" fill="#58eedb" stroke="none" opacity="0.460"/><path d="M968 206H987 M982 201 987 206 982 211" fill="none" stroke="#718eb6" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" /><rect x="799" y="130" width="174" height="153" rx="19" fill="#58eedb" stroke="none" opacity="0.000"/><rect x="802" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="802" y="133" width="168" height="147" rx="17" fill="none" stroke="#58eedb" opacity="0.000" stroke-width="2"/><rect x="866" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(868 153) scale(0.75)"><path d="M5 31H17L29 18H41 M34 11 41 18 34 25 M5 20H12 M19 36H29" fill="none" stroke="#58eedb" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="886" y="235" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">In transit</text><rect x="861" y="266" width="50" height="3" rx="1.5" fill="#58eedb" stroke="none" opacity="0.460"/><rect x="989" y="130" width="174" height="153" rx="19" fill="#72efb6" stroke="none" opacity="0.000"/><rect x="992" y="133" width="168" height="147" rx="17" fill="url(#panel)" stroke="#385275" /><rect x="992" y="133" width="168" height="147" rx="17" fill="none" stroke="#72efb6" opacity="0.000" stroke-width="2"/><rect x="1056" y="151" width="40" height="40" rx="10" fill="#20334e" stroke="#385275" /><g transform="translate(1058 153) scale(0.75)"><path d="M9 24 24 17 39 24V41H9Z M9 24 24 30 39 24 M24 30V41 M18 10 23 15 32 6" fill="none" stroke="#72efb6" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" /></g><text x="1076" y="235" font-size="23" fill="#f3f8ff" font-weight="700" text-anchor="middle" letter-spacing="0">Received</text><rect x="1051" y="266" width="50" height="3" rx="1.5" fill="#72efb6" stroke="none" opacity="0.460"/><path d="M232 301v7h358v-7" fill="none" stroke="#ffd18a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/><text x="411" y="335" font-size="18" fill="#ffd18a" font-weight="650" text-anchor="middle" letter-spacing="0">Approval completes with reservation</text><text x="791" y="335" font-size="18" fill="#58eedb" font-weight="650" text-anchor="middle" letter-spacing="0">Source → transit</text><text x="1076" y="335" font-size="18" fill="#72efb6" font-weight="650" text-anchor="middle" letter-spacing="0">Transit → destination</text></g>
</svg>
