<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Branch hierarchy</title>
  <desc id="description">Branch hierarchy in turquoise line art on a navy plate.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080f23"/><stop offset="1" stop-color="#181c42"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#192943"/><stop offset="1" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="wire" x2="1" y2="0">
      <stop stop-color="#256781"/><stop offset="1" stop-color="#58eedb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3868d3" stop-opacity=".32"/><stop offset="1" stop-color="#3868d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a0c3fb" opacity=".16"/>
    </pattern>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="96" height="96" rx="24" fill="url(#bg)" stroke="none" /><ellipse cx="61.44" cy="46.08" rx="34.56" ry="46.08" fill="url(#glow)"/><rect x="8" y="8" width="80" height="80" rx="19" fill="url(#grid)" stroke="none" /><rect x="0.5" y="0.5" width="95" height="95" rx="24" fill="none" stroke="#2b4064" /><rect x="17" y="17" width="62" height="62" rx="15" fill="#112746" stroke="#37547b" /><g transform="translate(24 24) scale(1)"><path d="M24 14V23 M24 23H10V32 M24 23H38V32" fill="none" stroke="#58eedb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><rect x="18" y="4" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /><rect x="4" y="32" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /><rect x="32" y="32" width="12" height="10" rx="2" fill="#142742" stroke="#58eedb" /></g></g>
</svg>
